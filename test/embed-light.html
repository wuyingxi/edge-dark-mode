<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浅色表单 · iframe</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 18px;
    background: #ffffff; color: #23262c;
    font: 12px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .head img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
  .head strong { display: block; font-size: 12.5px; }
  .head span { display: block; color: #7b828d; font-size: 10.5px; }
  label { display: block; margin: 8px 0 3px; color: #707782; font-size: 10px; }
  input {
    width: 100%; padding: 7px 9px; border: 1px solid #ddd9d0; border-radius: 8px;
    background: #fbfaf7; color: #23262c; font: inherit;
  }
  button {
    width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 8px;
    background: #23262c; color: #fff; font: inherit; font-weight: 600;
  }
  .note { margin-top: 9px; color: #9a7a4e; background: #f7efdf; border-radius: 7px; padding: 7px 9px; font-size: 9.5px; }
</style>
</head>
<body>
  <div class="head">
    <img src="avatar.jpg" alt="头像">
    <div><strong>订阅晨间来信</strong><span>每周日早上寄出</span></div>
  </div>
  <label>邮箱</label>
  <input type="email" placeholder="you@example.com">
  <label>称呼</label>
  <input type="text" placeholder="怎么称呼你？">
  <button type="button">订阅</button>
  <div class="note">这是一段浅色提示文字，用来检查背景是否被正确压暗。</div>
</body>
</html>
