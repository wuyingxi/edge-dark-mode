<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深色播放器 · iframe</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 18px;
    background: #0b0f14; color: #e8edf3;
    font: 12px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .player { display: flex; gap: 12px; align-items: center; }
  .cover { position: relative; flex: none; width: 104px; height: 104px; border-radius: 12px; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute; inset: 0; margin: auto; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(8, 12, 9, .76); color: #7fd4a8; display: grid; place-items: center; font-size: 13px;
  }
  .meta strong { display: block; font-size: 12.5px; margin-bottom: 3px; }
  .meta span { display: block; color: #8d99a8; font-size: 10.5px; }
  .bar { margin-top: 10px; height: 4px; border-radius: 99px; background: #222b36; overflow: hidden; }
  .bar i { display: block; width: 38%; height: 100%; background: #7fd4a8; }
  .row { display: flex; justify-content: space-between; margin-top: 5px; color: #697687; font-size: 9.5px; }
</style>
</head>
<body>
  <div class="player">
    <div class="cover">
      <img src="photo.jpg" alt="节目封面">
      <div class="play">▶</div>
    </div>
    <div class="meta">
      <strong>凌晨两点的便利店</strong>
      <span>第 42 期 · 深夜电台</span>
      <div class="bar"><i></i></div>
      <div class="row"><span>14:22</span><span>38:00</span></div>
    </div>
  </div>
</body>
</html>
