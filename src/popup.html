<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暗夜模式</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="identity">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M20.3 14.6A8.7 8.7 0 0 1 9.4 3.7a8.7 8.7 0 1 0 10.9 10.9Z" fill="currentColor"/>
            <circle cx="17.6" cy="6.4" r="1.15" fill="currentColor" opacity=".55"/>
          </svg>
        </div>
        <div class="titles">
          <h1>暗夜模式</h1>
          <p class="sub">Dark Mode for Edge</p>
        </div>
      </div>
      <label class="switch" title="全局开关">
        <input id="enabled" type="checkbox" role="switch" aria-label="启用暗色模式">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <div class="status" id="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">正在读取设置…</span>
    </div>

    <section class="panel" aria-labelledby="modeTitle">
      <div class="panel-head">
        <h2 id="modeTitle">模式</h2>
        <span class="tip">智能模式更省心</span>
      </div>
      <div class="seg" id="modeSeg" role="group" aria-label="渲染模式">
        <button type="button" data-mode="auto" aria-pressed="true">
          <span>智能</span>
          <small>跳过原生深色网站</small>
        </button>
        <button type="button" data-mode="always" aria-pressed="false" title="强制所有页面套用反色滤镜；原生深色网站也会变亮">
          <span>强制</span>
          <small>所有网页都反色</small>
        </button>
      </div>
    </section>

    <section class="panel" aria-labelledby="lookTitle">
      <div class="panel-head">
        <h2 id="lookTitle">画面</h2>
        <span class="tip">拖动实时生效</span>
      </div>

      <div class="slider-row">
        <div class="slider-top">
          <label for="brightness">亮度</label>
          <output id="brightnessOut" for="brightness">100%</output>
        </div>
        <input id="brightness" type="range" min="70" max="130" step="1" value="100" aria-label="亮度">
      </div>

      <div class="slider-row">
        <div class="slider-top">
          <label for="contrast">对比度</label>
          <output id="contrastOut" for="contrast">100%</output>
        </div>
        <input id="contrast" type="range" min="80" max="130" step="1" value="100" aria-label="对比度">
      </div>

      <div class="slider-row">
        <div class="slider-top">
          <label for="saturation">饱和度</label>
          <output id="saturationOut" for="saturation">100%</output>
        </div>
        <input id="saturation" type="range" min="50" max="150" step="1" value="100" aria-label="饱和度">
      </div>
    </section>

    <section class="panel site-panel" aria-labelledby="siteTitle">
      <div class="site-head">
        <div class="site-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="8.2"/>
            <path d="M3.8 12h16.4M12 3.8c2.2 2.2 3.3 5 3.3 8.2S14.2 18 12 20.2C9.8 18 8.7 15.2 8.7 12S9.8 6 12 3.8Z"/>
          </svg>
        </div>
        <div class="site-meta">
          <small id="siteTitle">当前网站</small>
          <strong id="siteHost">读取中…</strong>
        </div>
        <span class="chip" id="siteChip">跟随全局</span>
      </div>
      <div class="site-seg" id="siteSeg" role="group" aria-label="当前网站规则">
        <button type="button" data-rule="auto">跟随</button>
        <button type="button" data-rule="on">强制</button>
        <button type="button" data-rule="off">关闭</button>
      </div>
    </section>

    <footer>
      <button type="button" class="link" id="reset" title="恢复默认外观，保留各网站规则">恢复默认外观</button>
      <span class="ver" id="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
